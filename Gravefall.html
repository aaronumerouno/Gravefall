<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravefall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Crimson+Pro:wght@400;600&display=swap">
<style>
:root{--bg:#14161a;--panel:#1d2025;--line:#3a4048;--text:#d9d2c0;--dim:#8f8b80;--brass:#b08d4a;--blood:#a8352b;--good:#7d9a5a;
 --display:'Teko','Impact',sans-serif;--body:'Crimson Pro',Georgia,serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e4dfd0;--panel:#d6d0bd;--line:#9b9580;--text:#1c1d20;--dim:#555248;--brass:#7a5c1f;--blood:#8c2a22;--good:#456a2c;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:20px/1.55 var(--body)}
main{max-width:640px;margin:0 auto;padding:20px 18px 48px}
h1{font:700 clamp(56px,16vw,88px)/.9 var(--display);margin:8px 0 4px;letter-spacing:.04em;color:var(--brass)}
.sub{margin:0 0 20px;color:var(--dim);font-style:italic}
.hud{display:grid;gap:8px;padding:14px;background:var(--panel);border-left:4px solid var(--brass)}
.bar{height:14px;background:var(--bg);border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--blood);transition:width .4s}
.row{display:flex;justify-content:space-between;font:500 24px/1 var(--display)}
.stats{display:flex;gap:18px;flex-wrap:wrap;font:500 22px/1 var(--display);color:var(--dim)}
.stats b{color:var(--text)}
#foe{display:none;margin-top:16px;padding:12px 14px;border:1px solid var(--blood)}
#foe.show{display:grid;gap:8px}
#foe .bar>i{background:var(--brass)}
#text{margin:22px 0}
#text h2{font:700 36px/1 var(--display);margin:0 0 8px}
#text p{margin:0 0 12px;max-width:62ch}
#roll{display:none;align-items:center;gap:16px;padding:12px 14px;margin-bottom:16px;border:1px solid var(--line)}
#roll.show{display:flex}
.die{flex:none;width:72px;height:80px;display:grid;place-items:center;background:var(--brass);color:#14161a;font:700 36px/1 var(--display);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.die.crit{background:var(--good)}.die.fumble{background:var(--blood);color:#d9d2c0}
.die.spin{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.die.spin{animation:none}}
#result{margin:0;font-size:18px}
#choices{display:grid;gap:10px}
button{font:inherit;text-align:left;padding:12px 14px;background:var(--panel);color:var(--text);border:1px solid var(--line);cursor:pointer}
button:hover:not(:disabled){border-color:var(--brass)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button small{display:block;color:var(--dim);font-size:16px}
details{margin-top:24px;border:1px solid var(--line);background:var(--panel)}
summary{padding:12px 14px;cursor:pointer;font:500 24px/1 var(--display)}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.slot span{flex:1 1 160px}.slot small{display:block;color:var(--dim);font-size:16px}
.slot button{padding:6px 10px;font-size:17px}
.eq{color:var(--good)}
h3{font:700 28px/1 var(--display);margin:0 0 4px;color:var(--brass)}
.tip{cursor:help;border-bottom:1px dotted var(--dim)}
#tip{position:fixed;z-index:20;display:none;max-width:280px;padding:10px 12px;background:var(--panel);border:1px solid var(--brass);font-size:17px;line-height:1.4}
#bgart{position:fixed;inset:0;z-index:-1;opacity:.55}
#bgart{width:100%;height:100%;image-rendering:pixelated;animation:tw 6s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #bgart{opacity:.35}}
#art{order:2;border:1px solid var(--line);margin-bottom:16px;background:#0e1014;position:relative;aspect-ratio:160/75;overflow:hidden}
#art canvas{position:absolute;image-rendering:pixelated}
#abg{left:0;top:0;width:100%;height:100%;animation:flick 7s infinite}
@keyframes flick{0%,93%,100%{filter:none}95%{filter:brightness(1.3)}}
.foefig{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.foefig.hit{animation:hit .4s}
@keyframes breathe{50%{transform:scale(1.03)}}
@keyframes hit{0%{filter:brightness(4)}100%{filter:none}}
@media (prefers-reduced-motion:reduce){#bgart,#abg,.foefig{animation:none}}
/* ===== HUD portrait, chapters, mobile sizing ===== */
.hudhead{display:flex;gap:12px;align-items:center}
.hudmain{flex:1;display:grid;gap:6px}
#pf{width:96px;image-rendering:pixelated;border:2px solid var(--brass);background:#0e1014;flex:none}
.who{font:500 20px/1 var(--display);color:var(--dim)}
.chapter{margin:0 0 14px;padding:0;background:none;border:1px solid var(--brass)}
.chapter>summary{display:flex;align-items:center;gap:10px;padding:10px 14px;font:inherit}
.chapter>summary .chaptext{display:grid;gap:2px}
.chapter>summary small{color:var(--dim);font-size:16px}
.chapter>summary b{font:700 28px/1 var(--display);color:var(--brass)}
.chapter>summary .chev{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--brass);border-radius:50%;color:var(--brass);font-size:16px;transition:transform .2s ease;flex:none}
.chapter[open]>summary .chev{transform:rotate(180deg)}
.chapter.locked{opacity:.55}
.chapter.locked>summary{cursor:default}
.chapter.locked>summary .chev{display:none}
.chapter.locked .lockmsg{color:var(--dim);font-style:italic}
.chapbody{padding:12px}
[data-device=mobile] .chapbody{padding:8px}
[data-device=mobile] .hud{padding:10px;gap:6px}
[data-device=mobile] #pf{width:64px}
[data-device=mobile] .row{font-size:19px}
[data-device=mobile] .stats{font-size:17px;gap:12px}
[data-device=mobile] .bar{height:10px}
[data-device=mobile] .opts button{min-height:36px;padding:6px 10px;font-size:15px}
[data-device=mobile] details:not(.chapter)>summary{font-size:19px;padding:9px 12px}
[data-device=mobile] details:not(.chapter){margin-top:14px}
[data-device=mobile] .slot{padding:8px 10px;font-size:16px}
[data-device=mobile] .slot small{font-size:14px}
[data-device=mobile] .slot button{min-height:36px;font-size:15px;padding:4px 10px}
[data-device=mobile] #hist,[data-device=mobile] #acts{font-size:14px}
#result .ln{display:block;margin-top:8px}
#result .calc{color:var(--dim);font-size:16px}
.chap{margin:0 0 16px;padding:10px 14px;border:1px solid var(--brass);display:grid;gap:2px}
.chap small{color:var(--dim);font-size:16px}
.chap b{font:700 28px/1 var(--display);color:var(--brass)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{padding:6px 10px;font-size:17px;text-align:center}
[data-device=mobile] .opts button{min-height:44px;padding:8px 12px}
#result .chg{color:var(--brass);font-weight:600}
.note{font-style:italic;color:var(--brass);border-left:3px solid var(--brass);padding-left:12px}
#hist,#acts{margin:0;padding:0 14px 10px 36px;font-size:16px;max-height:260px;overflow:auto}
#hist li,#acts li{margin:4px 0;color:var(--dim)}
#histbox{order:7}#actbox{order:8}
[data-device=desktop] #histbox,[data-device=desktop] #actbox{margin-top:16px}
/* ===== DEVICE LAYOUTS: html[data-device] is set by detectDevice() ===== */
.layout{display:flex;flex-direction:column}
aside,.play{display:contents}
.hud{order:1}#foe{order:2}#text{order:3}#roll{order:4}#choices{order:5}#packbox{order:6}
[data-device=mobile] button{min-height:52px;padding:14px}
[data-device=mobile] .slot button{min-height:44px;padding:8px 12px}
[data-device=desktop] body{font-size:22px}
[data-device=desktop] main{max-width:1040px}
[data-device=desktop] .layout{display:grid;grid-template-columns:320px 1fr;gap:36px;align-items:start}
[data-device=desktop] aside{display:block;position:sticky;top:16px}
[data-device=desktop] .play{display:block}
[data-device=desktop] #text{margin-top:0}
[data-device=desktop] #foe,[data-device=desktop] #packbox{margin-top:16px}
</style>
</head>
<body>
<canvas id="bgart" aria-hidden="true"></canvas>
<main>
<h1>Gravefall</h1>
<p class="sub">Ironwolf Company, Third Platoon. One captain, one reactor, one roll at a time.</p>
<div id="chapters"></div>
<div class="layout" id="layout"><aside>
<section class="hud" aria-label="Status">
 <div class="hudhead"><canvas id="pf" width="24" height="22"></canvas><div class="hudmain"><div class="who">Captain Dax Ironside</div><div class="row"><span>Vitality</span><span id="hpnum"></span></div><div class="bar"><i id="hpbar"></i></div></div></div>
 <div class="stats" id="stats"></div>
 <div class="opts"><button id="vtog"></button><button id="stog"></button><button id="vrep">Replay voice</button><button id="nsave">New game</button></div>
</section>
<section id="foe" aria-live="polite"><div class="row"><span id="foename"></span><span id="foenum"></span></div><div class="bar"><i id="foebar"></i></div><div class="stats" id="foestats"></div></section>
<details id="packbox"><summary id="packsum"></summary><div id="pack"></div></details>
<details id="histbox"><summary>Roll history</summary><ol id="hist"></ol></details>
<details id="actbox"><summary>Action history</summary><ol id="acts" reversed></ol></details>
</aside><div class="play"><div id="art"></div>
<section id="text" aria-live="polite"></section>
<section id="roll" aria-live="polite"><div class="die" id="die">–</div><p id="result"></p></section>
<section id="choices"></section>
</div></div>
</main>
<script>
/* ===== RULES ===== */
const CONFIG={die:20,maxHp:28,critHeal:3,fumbleDmg:2,bag:10,allocPoints:3,showOdds:false,voice:false,sfx:true,stats:{might:1,guile:1,resolve:1}};
const SAVE_KEY='gravefall_save',SAVE_VER=2; /* bump SAVE_VER on any save-breaking change; old saves are then ignored, not crashed on */
const SAGA='The Gravefall Saga',CHAPTERS={1:'Iron in the Dark',2:'The Hollow Moon',3:'The Hive’s End'};  /* add chapters here; give a scene chapter:2 to switch */
const LABELS={might:'Might',guile:'Guile',resolve:'Resolve'};

/* ===== ITEMS: 4 equipment slots (melee, gun, body, legs) plus consumables (use). Add entries here;
   add ids to DROPS to let monsters drop them. Body/legs armor may carry a stat bonus (stat:{might,guile,resolve}). ===== */
const CAT_LABEL={melee:'Melee weapon',gun:'Ranged weapon',body:'Body armor',legs:'Leg armor',use:'Consumable'};
const ITEMS={
 chainblade:{n:'Ironwolf Cutter',slot:'melee',atk:6,acc:1},
 cleaver:{n:'Salvaged Pipe Wrench',slot:'melee',atk:4,acc:0,tier:'weak'},
 shiv:{n:'Trench Shiv',slot:'melee',atk:5,acc:1,tier:'weak'},
 maul:{n:'Thunderclap Sledge',slot:'melee',atk:10,acc:0,tier:'strong'},
 spike:{n:'Void Spike',slot:'melee',atk:9,acc:2,tier:'strong'},
 pistol:{n:'Salvaged Repeater',slot:'gun',atk:5,acc:1,tier:'weak'},
 plasma:{n:'Sunspear Lancer',slot:'gun',atk:13,acc:-1,tier:'strong'},
 carapace:{n:'Ironwolf Flak Vest',slot:'body',dr:2},
 scrap:{n:'Bolted Hull Plating',slot:'body',dr:1,tier:'weak'},
 bodyMight:{n:'Brute-Forged Breastplate',slot:'body',dr:1,stat:{might:1},tier:'weak'},
 bodyGuile:{n:'Shadowweave Vest',slot:'body',dr:1,stat:{guile:1},tier:'weak'},
 bodyResolve:{n:'Stalwart Harness',slot:'body',dr:1,stat:{resolve:1},tier:'weak'},
 bodyMix:{n:'Hybrid Combat Rig',slot:'body',dr:1,stat:{guile:1,resolve:1},tier:'weak'},
 bulwark:{n:'Anvil-Class Siege Plate',slot:'body',dr:4,tier:'strong'},
 bodyMightS:{n:'Juggernaut Plate',slot:'body',dr:3,stat:{might:2},tier:'strong'},
 bodyGuileS:{n:'Phantom Weave Plate',slot:'body',dr:3,stat:{guile:2},tier:'strong'},
 bodyResolveS:{n:'Bastion Plate',slot:'body',dr:3,stat:{resolve:2},tier:'strong'},
 bodyMixS:{n:'Warbound Plate',slot:'body',dr:3,stat:{might:1,guile:1,resolve:1},tier:'strong'},
 legplate:{n:'Salvaged Legplate',slot:'legs',dr:1,tier:'weak'},
 legsMight:{n:'Stormtrooper Greaves',slot:'legs',dr:1,stat:{might:1},tier:'weak'},
 legsGuile:{n:'Silent Treads',slot:'legs',dr:1,stat:{guile:1},tier:'weak'},
 legsResolve:{n:'Anchor Greaves',slot:'legs',dr:1,stat:{resolve:1},tier:'weak'},
 legsMix:{n:'Scavenger Leg Guards',slot:'legs',dr:1,stat:{might:1,resolve:1},tier:'weak'},
 ablative:{n:'Ablative Plating',slot:'legs',dr:3,tier:'strong'},
 legsMightS:{n:'Siegebreaker Greaves',slot:'legs',dr:2,stat:{might:2},tier:'strong'},
 legsGuileS:{n:'Nightfall Treads',slot:'legs',dr:2,stat:{guile:2},tier:'strong'},
 legsResolveS:{n:'Unbreakable Greaves',slot:'legs',dr:2,stat:{resolve:2},tier:'strong'},
 legsMixS:{n:'Warden’s Leg Plate',slot:'legs',dr:2,stat:{might:1,guile:1,resolve:1},tier:'strong'},
 stim:{n:'Rattlesnake Stim',slot:'use',heal:6,tier:'weak'},
 bandage:{n:'Field Bandage',slot:'use',heal:4,tier:'weak'},
 medikit:{n:'Lazarus Trauma Kit',slot:'use',heal:12,tier:'strong'},
 nanite:{n:'Nanite Canister',slot:'use',heal:9,tier:'strong'},
 hiveblade:{n:'Hivebreaker Gauntlet',slot:'melee',atk:11,acc:1,tier:'strong'},
 elixir:{n:'Sovereign’s Elixir',slot:'use',heal:15,tier:'strong'}
};
const DROPS={
 small:['cleaver','shiv','pistol','scrap','bodyMight','bodyGuile','bodyResolve','bodyMix','legplate','legsMight','legsGuile','legsResolve','legsMix','stim','bandage'],
 big:['maul','spike','plasma','bulwark','bodyMightS','bodyGuileS','bodyResolveS','bodyMixS','ablative','legsMightS','legsGuileS','legsResolveS','legsMixS','medikit','nanite','hiveblade','elixir']
};
/* ===== LORE: [story, how it behaves when used] per item id; STAT_INFO: stat tooltips ===== */
const LORE={
 chainblade:['Standard issue to every Ironwolf officer. The edge hums when you hold it close.','Quick and reliable. Its vibrating edge finds gaps, so it is easy to land.'],
 cleaver:['Torn off a maintenance rack in the galley. Somebody carved a name into the handle.','Light and crude. It lands often but barely scratches big targets.'],
 shiv:['A boarding knife honed to a wire edge. Fits in a boot, not a sheath.','Short and quick. It finds a gap before the enemy can react.'],
 maul:['A dockhand’s sledgehammer rewired with a shock coil. The crew called it Thunderclap.','Slow to swing, then it crushes bone and plate in one blow.'],
 spike:['A railyard spike charged with a void-black current. It hums when it is close to flesh.','Punches clean through plate instead of around it.'],
 pistol:['A cobbled-together sidearm from the ship’s small-arms locker.','Light recoil, easy to bring to bear in a hurry.'],
 plasma:['Prototype railcaster from the carrier’s weapons lab. It hums with stolen sunlight.','Fires a searing bolt that hits like a shell, but the kick makes it harder to aim.'],
 carapace:['Layered ceramic plate, scarred by a dozen landings.','Steady protection that never runs out.'],
 scrap:['Hull plating bolted over your ribs by a very nervous mechanic.','Better than nothing, and it rattles when you move.'],
 bodyMight:['Reinforced across the shoulders for throwing your full weight into a blow.','Trades coverage for leverage.'],
 bodyGuile:['Stitched with sliding plates that move the way you do.','Light enough to barely notice you are wearing it.'],
 bodyResolve:['A chest rig built to keep a soldier breathing through anything.','Steadies the nerves as much as it stops a blade.'],
 bodyMix:['A scavenger’s patchwork of plate, mesh and padding.','A bit of everything, none of it wasted.'],
 bulwark:['Cut from the blast door of the siege tank Old Bessie.','Heavy, but most blows break against it.'],
 bodyMightS:['Full war-plate built for soldiers who lead with the shoulder.','Turns every swing into a sledgehammer.'],
 bodyGuileS:['Ghost-pattern plate that drinks light instead of reflecting it.','Moves like it is barely there.'],
 bodyResolveS:['A command-rank chestpiece, rated to take a direct hit and keep its wearer upright.','Makes you very hard to put down.'],
 bodyMixS:['Veteran plate rebuilt three times over, and better for it.','Balanced in every way that matters.'],
 legplate:['Greaves stripped off a dead Rustjack and refitted in a hurry.','Covers the worst of it, though the straps never quite sit right.'],
 legsMight:['Heavy greaves built to anchor a charge.','Lets you put your whole body behind a hit.'],
 legsGuile:['Soft-soled treads that leave almost no sound.','Perfect for closing a gap unseen.'],
 legsResolve:['Braced greaves that lock your stance under fire.','Keeps you standing when the deck shakes.'],
 legsMix:['Mismatched guards salvaged from three different corpses.','Awkward to look at, useful all the same.'],
 ablative:['Overlapping ceramic tiles meant to shed a glancing hit rather than stop it cold.','Sheds most of a blow, every time, without the weight of full plate.'],
 legsMightS:['Siege-rated greaves, built to plant and swing without flinching.','Turns your footing into a weapon.'],
 legsGuileS:['Treads engineered for a ghost unit that no longer exists.','You are gone before the echo catches up.'],
 legsResolveS:['Command-grade greaves rated against anything short of a direct hit.','Nothing short of a direct hit moves you.'],
 legsMixS:['A warden’s field kit, rebuilt from three fallen soldiers’ gear.','No weakness anyone has found yet.'],
 stim:['A trooper’s trick: a cheap injector that bites like a rattlesnake.','Slammed into the thigh, it mends flesh at once and leaves your hands shaking. Used up.'],
 bandage:['A field dressing from a dead medic’s kit, torn open in a hurry.','Stops the worst of the bleeding. Used up.'],
 medikit:['Lieutenant Quill’s favorite field kit. Real surgical glue, real morphine.','Closes deep wounds fast. Used up.'],
 nanite:['A sealed canister of medical nanites, cold to the touch even through a glove.','Floods a wound and knits it shut in seconds. Used up.'],
 hiveblade:['Grown rather than forged, torn from something that does not have a name yet. It still twitches.','Closes on a target like a trap and does not let go easily.'],
 elixir:['A vial of something the hive kept at its very center, warm and faintly luminous.','Mends flesh so completely it almost feels wrong. Used up.']};
const statLine=i=>i.stat?Object.entries(i.stat).map(([k,v])=>`${LABELS[k]} ${v>=0?'+':''}${v}`).join(', '):'';
const tipText=id=>{const i=ITEMS[id],[l,u]=LORE[id]||['',''];
 const t=(i.slot==='melee'||i.slot==='gun')?`${CAT_LABEL[i.slot]}. Damage ${i.atk}, accuracy ${i.acc>=0?'+':''}${i.acc}.`
  :(i.slot==='body'||i.slot==='legs')?`${CAT_LABEL[i.slot]}. Blocks ${i.dr} damage from each hit.`+(i.stat?` Also ${statLine(i)}.`:'')
  :`Consumable. Heals ${i.heal} vitality.`;
 return `<b>${i.n}</b><br>${t}<br><em>${l}</em><br>${u}`;};
const STAT_INFO={might:'Raw strength. Used to strike, smash doors and tear through enemies. Your weapon’s accuracy adds to it.',
 guile:'Cunning and stealth. Used to hack, search and slip past danger.',
 resolve:'Nerve and endurance. Used to guard, hold the line and stay steady through pain.',
 armor:'Your Defense, from armor. It reduces every hit you take, but never below 1.',
 evasion:'Equal to your Guile. It also reduces every hit you take by this amount.',
 accuracy:'Your weapon adds this to every Might roll to hit. Heavy weapons are less accurate.',
 foeEva:'How hard this enemy is to hit. Your hit roll must reach this number.',
 foeDef:'Subtracted from every hit you land. Critical hits ignore it.',
 foeAtk:'Its damage before your Defense and Evasion reduce it.',
 foeAcc:'How hard it is to guard against. Your Guard roll must reach this number.',
 damage:'Damage your equipped weapon deals on a hit. Critical hits add it again.'};
const tipSpan=(t,h)=>`<span class="tip" tabindex="0" data-tip="${h}">${t}</span>`;
const gear=s=>({melee:ITEMS[s.eq.melee]||{atk:2,acc:0},gun:ITEMS[s.eq.gun]||null,body:ITEMS[s.eq.body]||{dr:0},legs:ITEMS[s.eq.legs]||{dr:0}});
const armorDr=s=>gear(s).body.dr+gear(s).legs.dr;
const gearStatBonus=(s,stat)=>{const g=gear(s);return((g.body.stat&&g.body.stat[stat])||0)+((g.legs.stat&&g.legs.stat[stat])||0);};

/* ===== MODIFIERS: situational roll bonuses ===== */
const MODIFIERS=[(s,c)=>c.stat==='might'?gear(s).melee.acc:0,(s,c)=>(s.boost&&s.boost[c.stat])||0,(s,c)=>gearStatBonus(s,c.stat)];

/* ===== EFFECTS: used in scene outcomes as fx:{hp:-3, flag:'x', give:'maul'|'small'|'big'} ===== */
const EFFECTS={
 hp:(s,v)=>{s.hp=Math.max(0,Math.min(CONFIG.maxHp,s.hp+v));},
 flag:(s,v)=>{s.flags[v]=1;},
 stat:(s,v)=>{for(const k in v)s.boost[k]=(s.boost[k]||0)+v[k];},
 give:(s,v)=>{if(DROPS[v]){const p=DROPS[v].filter(i=>!s.inv.includes(i));if(!p.length)return;
   const noMelee=!s.inv.some(i=>ITEMS[i].slot==='melee'),noGun=!s.inv.some(i=>ITEMS[i].slot==='gun'),
    pri=p.filter(i=>(noMelee&&ITEMS[i].slot==='melee')||(noGun&&ITEMS[i].slot==='gun')),
    pool=(pri.length&&Math.random()<.6)?pri:p;
   v=pool[Math.floor(Math.random()*pool.length)];}
  if(!s.inv.includes(v))s.pending=v;}
};

/* ===== SCENES: story is data. choice={text,goto,fx} or {text,check:{stat,dc},win:{msg,goto,fx},lose:{...}}
   fight scenes: fight:{name,hp,dc,dmg,drop:'small'|'big'|null,say:[taunts]}, then:'nextScene' ===== */
const SCENES={
 alloc:{title:'Choose Your Soldier',text:[
  'Before the airlock cycles, Captain Ironside checks his gear one last time. Every soldier fights differently: some lead with muscle, some with cunning, some with nerve. Spend your points, Captain — how do you fight?'],choices:[]},
 loadout:{title:'Opening Kit',text:[
  'Quartermaster’s last call before the drop. “One weapon up front, Captain, the other you will have to find,” Brannigan says. “And pick an armor that matches how you fight,” he adds.'],choices:[]},
 intro:{title:'The Breach',text:[
  'The carrier <em>Gravefall</em> drifts above a dead moon, her reactor screaming toward meltdown. Ironwolf Company’s Third Platoon died on the approach. Captain Ironside alone reached the airlock. “Captain Ironside, report,” Lieutenant Quill says over the comm from the gunship <em>Wrenhawk</em>. “Still breathing, Lieutenant,” Ironside growls. “Tell Corporal Brannigan to start the clock,” he adds.',
  '“Eleven minutes to core breach, Captain,” Corporal Brannigan says, his gravel voice cutting in. “The airlock is welded shut, and something on the other side is scratching to get out,” he adds.'],
  choices:[
   {text:'Smash through the bulkhead',check:{stat:'might',dc:14},win:{msg:'Steel buckles and the door falls inward.',goto:'c1',fx:{flag:'forced_entry'}},lose:{msg:'The door holds. Your shoulder does not.',goto:'c1',fx:{hp:-4,flag:'forced_entry'}}},
   {text:'Wait for Brannigan to crack the lock',check:{stat:'resolve',dc:11},win:{msg:'The lock clicks open. Brannigan grunts, pleased.',goto:'c1',fx:{flag:'picked_lock'}},lose:{msg:'The lock fires a shock into your gauntlet before it opens.',goto:'c1',fx:{hp:-3,flag:'picked_lock'}}}]},
 c1:{title:'The Scraping Dark',text:s=>[
  (s.flags.forced_entry
   ?'The corridor beyond is slick with black ichor, and the bang of the bulkhead has already woken something. Skitterlings pour from the ceiling vents, all legs and wet clicking. “Contact!” Ironside roars, and Quill answers, “They heard that, Captain — give them hell.”'
   :'The corridor beyond is slick with black ichor. Skitterlings pour from the ceiling vents, all legs and wet clicking. “Contact!” Ironside roars, and Quill answers, “Give them hell, Captain.”'),
  '“Captain, suit sensors make these things Skitterlings — bred stock, not sentient on their own,” Brannigan says, reading off a scrolling report between bursts of static. “Fleet intel says the swarms answer to humanoid commanders, armored things like Major Kraag. Whatever hive spawned them, our charts call it Gravemoor, out past the Rim,” he adds. “Doesn’t matter today,” Ironside growls. “Today they are just in our way.”',
  'The lead skitterling rears up. “Fresh meat,” the skitterling hisses in a stolen human voice. “Major Kraag will wear your dog tags,” it adds.'],
  fight:{name:'Skitterling',ref:'the skitterling',pr:'it',pos:'its',hp:9,dc:10,def:0,acc:6,dmg:4,drop:'small',say:['The skitterling lunges, clicking.','“Dog tags! Dog tags!” the skitterling hisses.','Claws scrape your vest as the skitterling shrieks.','The skitterling circles, legs clicking against the deck.','“Major Kraag feeds well tonight,” the skitterling hisses.','The skitterling’s jaw opens wider than it should.']},then:'relay'},
 relay:{title:'The Dead Relay',text:[
  '“Door ahead is a blast seal,” Brannigan says. “Reactor control is on the other side. I can crack it, comrade, but I need you to hold still and keep the vermin off my line,” he adds.',
  'Ironside presses his palm to the cold metal. Somewhere behind it, a heavy body shifts. “Corporal,” Ironside mutters, “tell me that is just the pipes.” Static. “Brannigan?” Ironside calls.'],
  choices:[
   {text:'Cover Brannigan’s hack and wait it out',check:{stat:'resolve',dc:11},win:{msg:'The seal grinds open on a clear path.',goto:'brute'},lose:{msg:'Something slams the door from the far side. You take the blast.',goto:'brute',fx:{hp:-4}}},
   {text:'Hack the console yourself',check:{stat:'guile',dc:12},win:{msg:'Sparks, a hiss, and the seal opens.',goto:'brute'},lose:{msg:'The console arcs through your gauntlet.',goto:'brute',fx:{hp:-5}}},
   {text:'Rip the seal off its hinges',check:{stat:'might',dc:14},win:{msg:'Metal shrieks and gives way.',goto:'brute'},lose:{msg:'You tear something in your back.',goto:'brute',fx:{hp:-6}}}]},
 brute:{title:'The Hullcrusher',text:[
  'The seal opens on a Hullcrusher, a mountain of fused muscle and welded plating, chained to the wall by its own hunger. It snaps the chains as Ironside steps inside. “Lieutenant, tell me you see this,” Ironside says. “I see it,” Quill answers. “Pray it bleeds,” she adds.',
  '“Little soldier!” the Hullcrusher bellows. “I have eaten better than you!” it adds.'],
  fight:{name:'Hullcrusher',ref:'the Hullcrusher',pr:'it',pos:'its',hp:16,dc:12,def:1,acc:8,dmg:7,drop:'big',say:['The Hullcrusher swings a fist the size of a hatch.','“Crunch! Crunch!” the Hullcrusher bellows.','The deck shakes under the Hullcrusher’s tread.','The Hullcrusher’s chains rattle as it advances.','“More!” the Hullcrusher roars, spitting rust and blood.','The Hullcrusher plants its feet and does not yield ground.']},then:'medbay'},
 medbay:{title:'The Silent Infirmary',text:[
  'Ironside staggers into a ruined infirmary and drops to one knee. “Captain, you are bleeding through your vest,” Quill says softly. “There are supplies in the lockers, if the dead left any. Choose fast,” she adds.',
  '“We have time,” Ironside says, and Brannigan mutters, “Seven minutes, comrade. Not quite.”'],
  choices:[
   {text:'Patch yourself up properly',check:{stat:'resolve',dc:9},win:{msg:'Your hands stay steady. The wounds close.',goto:'ambush',fx:{hp:10}},lose:{msg:'Pain blurs your vision, but you get the worst of it sealed.',goto:'ambush',fx:{hp:3}}},
   {text:'Search the lockers for supplies',check:{stat:'guile',dc:12},win:{msg:'Something useful at the back of a locker.',goto:'ambush',fx:{give:'small'}},lose:{msg:'A trap lashes out of the dark.',goto:'ambush',fx:{hp:-3}}},
   {text:'Press on, no time to waste',goto:'ambush'}]},
 ambush:{title:'The Gunnery Deck',text:[
  'A long gantry stretches over the gunnery deck, and the bodies of the dead crew line the rails. Then one of them lifts a rifle. “Contact, high!” Ironside shouts. A Rustjack gunner steps out of the dark, weapon already smoking. “For Major Kraag,” the gunner says. “For the Major,” it repeats.',
  '“Captain, there are more of them than I can count,” Brannigan says, his voice crackling.'],
  choices:[
   {text:'Take cover and fire back',check:{stat:'resolve',dc:11},win:{msg:'You hold your nerve and the volley goes wide.',goto:'gunner'},lose:{msg:'Rounds chew through your cover.',goto:'gunner',fx:{hp:-5}}},
   {text:'Charge across the gantry',check:{stat:'might',dc:14},win:{msg:'You barrel through the fire and slam into them.',goto:'gunner'},lose:{msg:'A round finds the gap in your armor.',goto:'gunner',fx:{hp:-7}}}]},
 gunner:{title:'Rustjack Gunner',text:[
  'The gunner drops its rifle and draws a serrated blade. “You should have stayed dead,” the gunner rasps. Quill is praying softly over the comm.'],
  fight:{name:'Rustjack gunner',ref:'the Rustjack gunner',pr:'it',pos:'its',hp:11,dc:11,def:1,acc:7,dmg:5,drop:'small',say:['A wet laugh rattles from the gunner’s chest.','“The Major sees you,” the gunner rasps.','The gunner’s blade scrapes your vest.','The gunner reloads a blade it does not need.','“Kraag remembers every face,” the gunner rasps.','The gunner spits something black onto the deck.']},then:'armory'},
 armory:{title:'The Dead Armory',text:[
  'Past the gunnery deck, a hangar holds the gutted siege tank <em>Old Bessie</em> and a sealed locker with a green light still burning. “Fleet reserve stores,” Brannigan says. “That is a Sunspear Lancer, Captain. Unstable, hungry, but it puts anything down. There is also a Lazarus kit beside it,” he adds.',
  'Ironside cannot carry both. “Choose,” Quill says. “And hurry,” she adds.'],
  choices:[{text:'Take the Sunspear Lancer',goto:'gate',fx:{give:'plasma',flag:'took_lancer'}},{text:'Take the Lazarus trauma kit',goto:'gate',fx:{give:'medikit',flag:'took_kit'}}]},
 gate:{title:'The Reactor Gate',text:[
  'The corridor ends at the reactor gate. “I smell a soldier,” Major Kraag calls through the door, his voice like grinding iron. “Come in, little one. I have been waiting since your ship was a speck in my sky,” he adds.',
  '“That is him,” Brannigan says quietly. “Major Kraag. He will kill you, Captain,” he adds. “Then he will have to try,” Ironside says, checking his blade.'],
  choices:[
   {text:'Slip in through the side vent',check:{stat:'guile',dc:13},win:{msg:'You drop behind him unseen. Your instincts sharpen.',goto:'boss',fx:{stat:{guile:1},flag:'stealth'}},lose:{msg:'The vent rattles. He turns, grinning, and your confidence slips.',goto:'boss',fx:{stat:{guile:-1},flag:'stealth'}}},
   {text:'Walk in and announce yourself',check:{stat:'resolve',dc:10},win:{msg:'Your voice does not shake. He pauses, almost impressed. Your resolve hardens.',goto:'boss',fx:{stat:{resolve:1},flag:'bold'}},lose:{msg:'A flicker of fear crosses your face. He notices, and your nerve wavers.',goto:'boss',fx:{stat:{resolve:-1},flag:'bold'}}}]},
 boss:{title:'Major Kraag',text:s=>[
  s.flags.stealth
   ?'Major Kraag stands before the screaming reactor, three meters of scarred iron and borrowed flesh, head cocked at a sound he cannot place. “Something is wrong,” he mutters, and then he finds you with his eyes. “There you are, little ghost,” Major Kraag snarls. “Clever. It will not save you,” he adds.'
   :s.flags.bold
   ?'Major Kraag stands before the screaming reactor, three meters of scarred iron and borrowed flesh. He already turned at the sound of your voice at the gate. “No ghost, then. A soldier who walks in the front door,” Major Kraag says, almost admiring. “I will enjoy this,” he adds.'
   :'Major Kraag stands before the screaming reactor, three meters of scarred iron and borrowed flesh. He raises a blade as long as Ironside is tall. “Your platoon died begging, Captain,” Major Kraag snarls. “Will you?” he adds.',
  '“Not today,” Ironside says, and Quill’s voice breaks. “Captain, the core has ninety seconds. Finish this,” she says.'],
  fight:{name:'Major Kraag',ref:'Major Kraag',pr:'he',pos:'his',hp:26,dc:13,def:5,acc:13,dmg:11,drop:null,say:['“Die loudly!” Major Kraag snarls.','Kraag’s blade splits the deck beside you.','“I will wear your armor,” Major Kraag growls.','Kraag laughs, a sound like grinding iron.','“Your platoon screamed louder,” Major Kraag says.','The deck buckles under Kraag’s advance.']},then:'victory'},
 victory:{title:'Victory',end:1,text:s=>[
  'Kraag falls, and the reactor’s scream breaks into silence. Ironside slams the override and brings the core down by hand, one shaking breath at a time. “Core stable,” Brannigan reports, disbelief in his voice. “Gravefall is not going anywhere today, Captain.”',
  'The <em>Wrenhawk</em> docks at Gravefall’s forward bay, clamps locking home with a shudder Ironside feels through the deck. Quill and Brannigan cross over and find him still standing in the reactor hall. “We held her,” Ironside says. Quill laughs through tears. “You held her, Captain. All of her,” she says.'+
   (s.flags.stealth?' “Still can’t believe he never heard you coming,” Brannigan says. “I will take it,” Ironside says.'
    :s.flags.bold?' “You walked right up to him, Captain,” Quill says, half scolding, half in awe. “Worked, didn’t it,” Ironside says.'
    :'')+
   (s.flags.took_lancer?' The Lancer still hums warm in Ironside’s grip. “Good shooting,” Brannigan says.'
    :s.flags.took_kit?' Quill checks the Trauma Kit in Ironside’s pack, relieved it is still there. “Keep that close, Captain,” she says.'
    :''),
  'They share what little the galley still has — cold rations and a toast to Third Platoon — before the comm crackles with new orders. “Colonel Vex is still out there, on the dead moon,” Brannigan says. “Then we are not done,” Ironside says, already moving for the Wrenhawk.',
  'Chapter 1 of the Gravefall Saga ends here, but the war for the dead moon has only begun.']},
 dead:{title:'Fallen',end:1,text:[
  'The dark takes Ironside. Quill’s voice fades to static, and Brannigan says only, “Goodbye, Captain.” Ironside’s name joins the long list on the memorial wall of Ironwolf Company.']}
};

/* ===== CHAPTER 2: same format as chapter 1. bg = which scene art to reuse. fight.art = which sprite to use. ===== */
Object.assign(SCENES,{
 ch2_start:{title:'Crash Landing',bg:'intro',text:[
  'The <em>Wrenhawk</em> undocks from Gravefall’s bay and burns hard for the dead moon below, one engine already running hot. “Captain, we lost the port thruster,” Quill says, her hands white on the controls. “Brace for a hard landing,” Brannigan adds.',
  'Below, a mining colony glows green in the dark. “That is Hollow Station,” Brannigan says. “Colonel Vex holds it, and Kraag’s fleet took orders from him.” “Then we pay him a visit,” Ironside says, checking his blade.'],
  choices:[
   {text:'Ride out the crash in the cockpit',check:{stat:'resolve',dc:11},win:{msg:'The gunship slams down hard but holds together.',goto:'ch2_tunnel',fx:{flag:'crash_brace'}},lose:{msg:'The hull buckles and throws you into the console.',goto:'ch2_tunnel',fx:{hp:-4,flag:'crash_brace'}}},
   {text:'Jump clear before impact',check:{stat:'might',dc:13},win:{msg:'You roll clear as the Wrenhawk burns behind you.',goto:'ch2_tunnel',fx:{flag:'crash_jump'}},lose:{msg:'You hit the rock hard and tumble.',goto:'ch2_tunnel',fx:{hp:-5,flag:'crash_jump'}}}]},
 ch2_tunnel:{title:'The Green Mist',bg:'c1',text:s=>[
  (s.flags.crash_jump
   ?'The mine tunnels are thick with green mist, and Ironside is still favoring the leg he landed on. Skitterlings swarm from the ore carts. “Contact, left!” Ironside roars, and Brannigan answers, “I count a dozen, Captain — go easy on that leg.”'
   :'The mine tunnels are thick with green mist. Skitterlings swarm from the ore carts. “Contact, left!” Ironside roars, and Brannigan answers, “I count a dozen, Captain.”'),
  'The brood leader clicks and shrieks. “Vex wants you alive,” the brood leader hisses. “Alive, for now,” it adds.'],
  fight:{name:'Skitterling brood',art:'Skitterling',ref:'the brood leader',pr:'it',pos:'its',hp:13,dc:11,def:0,acc:7,dmg:5,drop:'small',say:['The brood leader lunges, clicking.','“Alive for now!” the brood leader hisses.','Claws scrape your vest as the brood shrieks.','The brood leader shrieks and more claws answer from the dark.','“The Colonel wants you breathing,” the brood leader hisses.','The brood leader’s many eyes fix on you at once.']},then:'ch2_lift'},
 ch2_lift:{title:'The Dead Lift',bg:'relay',text:[
  'The only way down to Hollow Station is a dead mining lift. “Power is out, Captain,” Brannigan says. “I can bridge it, but it will take a minute,” he adds.',
  'Down the shaft, something heavy is climbing. “Whatever it is, it is coming up fast,” Quill says over the comm.'],
  choices:[
   {text:'Rig the lift with Brannigan',check:{stat:'guile',dc:12},win:{msg:'The lift hums to life. Your instincts sharpen.',goto:'ch2_pit',fx:{stat:{guile:1}}},lose:{msg:'The wires spark and burn your hands. Your confidence slips.',goto:'ch2_pit',fx:{stat:{guile:-1}}}},
   {text:'Brace the lift doors by hand',check:{stat:'might',dc:13},win:{msg:'The doors groan, then hold. Your grip hardens.',goto:'ch2_pit',fx:{stat:{might:1}}},lose:{msg:'The doors slip and crush your hand. Your arm feels weaker.',goto:'ch2_pit',fx:{stat:{might:-1}}}},
   {text:'Steady your breathing and wait',check:{stat:'resolve',dc:10},win:{msg:'Your nerves settle. Your resolve hardens.',goto:'ch2_pit',fx:{stat:{resolve:1}}},lose:{msg:'The silence gnaws at you. Your nerve wavers.',goto:'ch2_pit',fx:{stat:{resolve:-1}}}}]},
 ch2_pit:{title:'The Ironback',bg:'brute',text:[
  'The lift opens on a pit where an Ironback Hullcrusher waits, its chains already broken. “Captain, it is bigger than the last one,” Brannigan says. “Then we hit it harder,” Ironside growls.',
  '“Meat!” the Ironback bellows. “Meat for the Colonel!” it adds.'],
  fight:{name:'Ironback Hullcrusher',art:'Hullcrusher',ref:'the Ironback',pr:'it',pos:'its',hp:22,dc:12,def:2,acc:8,dmg:8,drop:'big',say:['The Ironback swings a fist the size of a hatch.','“Crunch! Crunch!” the Ironback bellows.','The deck shakes under the Ironback’s tread.','The Ironback’s plating grinds as it turns.','“Meat for the Colonel!” the Ironback roars again.','The Ironback does not flinch from the blow.']},then:'ch2_gate'},
 ch2_gate:{title:'The Control Hall',bg:'gate',text:[
  'Beyond the pit stands the control hall. “Colonel Vex is inside,” Quill says. “Captain, my scanners show the whole station is wired to blow,” she adds.',
  '“Then we end him quickly,” Ironside says. “Brannigan, find me that detonator,” he adds.'],
  choices:[
   {text:'Sneak through the vents',check:{stat:'guile',dc:13},win:{msg:'You drop in behind the consoles unseen. Your instincts sharpen.',goto:'ch2_boss',fx:{stat:{guile:1},flag:'stealth2'}},lose:{msg:'A grate clangs loose. Your confidence slips.',goto:'ch2_boss',fx:{stat:{guile:-1},flag:'stealth2'}}},
   {text:'Kick the door in',check:{stat:'might',dc:12},win:{msg:'The door flies off its hinges. Your grip hardens.',goto:'ch2_boss',fx:{stat:{might:1},flag:'bold2'}},lose:{msg:'The door holds and your leg buckles. Your strength wavers.',goto:'ch2_boss',fx:{stat:{might:-1},flag:'bold2'}}}]},
 ch2_boss:{title:'Colonel Vex',bg:'boss',text:s=>[
  s.flags.stealth2
   ?'Colonel Vex rises from the console, tall, green-lit and wrong, and turns a beat too late to find you already behind him. “Captain Ironside,” Colonel Vex says, a flicker of surprise in the soft voice. “You are quieter than Kraag warned me,” he adds.'
   :s.flags.bold2
   ?'Colonel Vex rises from the console, tall, green-lit and wrong, unhurried by the door crashing in. “Captain Ironside,” Colonel Vex says softly. “Kraag said you would announce yourself. I did not expect him to be right,” he adds.'
   :'Colonel Vex rises from the console, tall, green-lit and wrong. “Captain Ironside,” Colonel Vex says softly. “I have waited so long to meet you,” he adds.',
  '“You will wait forever,” Ironside says, and the station shakes. “Captain, thirty seconds,” Quill says. “Finish it,” she adds.'],
  fight:{name:'Colonel Vex',ref:'Colonel Vex',pr:'he',pos:'his',hp:34,dc:14,def:4,acc:14,dmg:10,drop:null,say:['“Kneel!” Colonel Vex snarls.','Vex’s blade carves a green scar across the deck.','“The Hollow remembers you,” Colonel Vex whispers.','Vex circles unhurried, green light trailing behind him.','“Kraag died quicker,” Colonel Vex says softly.','The air hums where Vex’s blade passes.']},then:'ch2_victory'},
 ch2_victory:{title:'Victory',bg:'victory',end:1,text:s=>[
  'Vex falls, and Hollow Station dies in green fire. Ironside throws himself into the lift as the moon shakes. “Captain!” Quill shouts, and Brannigan adds, “Go, go, go!”',
  'Ironside reaches the surface, scarred and alive. “One more down, comrades,” Ironside says. Quill laughs through tears. “One more, Captain,” she says.'+
   (s.flags.stealth2?' “You went through that whole station and he never saw you coming,” Brannigan says. “That is twice now,” Ironside says.'
    :s.flags.bold2?' “You keep walking straight through the front door, Captain,” Quill says. “It keeps working,” Ironside says.'
    :''),
  'Chapter 2 of the Gravefall Saga ends here, but the Colonel’s last signal points to something far older beneath the moon.']}
});

/* ===== CHAPTER 3: closes Act I (the alien war). bg = which scene art to reuse; new enemies reuse existing sprite rows with a new palette (see SPF). ===== */
Object.assign(SCENES,{
 ch3_start:{title:'Into the Dark Below',bg:'intro',text:[
  'Colonel Vex’s last signal traces to a fracture far beneath Hollow Station, a wound in the rock that should not be there. “Captain, I am reading something enormous down there,” Brannigan says, his voice tight. “Old. Older than the Colonel, older than the war,” he adds.',
  '“Then we go down and end it,” Ironside says. Quill eases the <em>Wrenhawk</em> over the open chasm. “Say the word, Captain,” she says.'],
  choices:[
   {text:'Rappel down the open chasm',check:{stat:'resolve',dc:11},win:{msg:'You drop through the dark and land steady.',goto:'ch3_den',fx:{flag:'chasm'}},lose:{msg:'The line jerks and you hit the deck hard.',goto:'ch3_den',fx:{hp:-4,flag:'chasm'}}},
   {text:'Force the sealed airlock nearby',check:{stat:'might',dc:14},win:{msg:'The old seal groans and gives way.',goto:'ch3_den',fx:{flag:'airlock'}},lose:{msg:'The airlock holds, and the recoil nearly breaks your wrist.',goto:'ch3_den',fx:{hp:-5,flag:'airlock'}}}]},
 ch3_den:{title:'The Writhing Dark',bg:'c1',text:[
  'Something ancient breathes beneath the dark. The walls themselves seem to shift, and a shape detaches from the rock, too many limbs, moving wrong. “Contact!” Ironside roars. “I have no reading on that thing, Captain,” Brannigan says. “None at all,” he adds.',
  'The Hive Stalker shrieks, a sound like metal tearing. “It is not alone,” Quill warns.'],
  fight:{name:'Hive Stalker',ref:'the Hive Stalker',pr:'it',pos:'its',hp:17,dc:12,def:0,acc:8,dmg:6,drop:'small',say:['The Hive Stalker lunges from the dark, too fast to track.','A sound like tearing metal rips from the Hive Stalker.','The Hive Stalker claws at you from every angle at once.','The Hive Stalker skitters along the wall, never still.','Something in the Hive Stalker’s shriek sounds almost like words.','The Hive Stalker presses the attack without pause.']},then:'ch3_relay'},
 ch3_relay:{title:'The Humming Walls',bg:'relay',text:[
  'The passage splits three ways, each wall pulsing faintly, almost like a heartbeat. “Captain, this place is alive,” Brannigan says, disbelief in his voice. “Pick a path and pick it fast, it is listening,” he adds.'],
  choices:[
   {text:'Read the pulses and follow the quiet one',check:{stat:'guile',dc:12},win:{msg:'You find the dead patch and slip through it.',goto:'ch3_warden'},lose:{msg:'The wall shudders under your hand before you find the way.',goto:'ch3_warden',fx:{hp:-4}}},
   {text:'Push through the weakest-looking wall',check:{stat:'might',dc:14},win:{msg:'The wall caves inward in a shower of dust.',goto:'ch3_warden'},lose:{msg:'The wall holds, and something behind it hits back.',goto:'ch3_warden',fx:{hp:-6}}},
   {text:'Hold steady while Quill gets a bearing',check:{stat:'resolve',dc:11},win:{msg:'Quill calls the path, calm and certain.',goto:'ch3_warden'},lose:{msg:'The pulse rises to a shriek before Quill can be sure.',goto:'ch3_warden',fx:{hp:-5}}}]},
 ch3_warden:{title:'The Core Warden',bg:'brute',text:[
  'The passage opens on a chamber built from fused rock and hull plate alike, and something rises to fill it, armored in overlapping plates grown rather than welded. “Lieutenant, tell me that is not what I think it is,” Ironside says. “It is bigger, Captain,” Quill answers. “It is always bigger,” she adds.',
  '“Guardian of the deep!” the Hive Warden booms, a voice built from a dozen stolen ones. “None pass!” it adds.'],
  fight:{name:'Hive Warden',ref:'the Hive Warden',pr:'it',pos:'its',hp:28,dc:12,def:3,acc:8,dmg:9,drop:'big',say:['The Hive Warden’s plated fist crashes down like a hull breach.','“None pass!” the Hive Warden booms.','The deck cracks under the Hive Warden’s weight.','The Hive Warden’s plating shifts and resets itself.','“Guardian stands!” the Hive Warden booms again.','The Hive Warden does not retreat, does not tire.']},then:'ch3_respite'},
 ch3_respite:{title:'The Dead Nest',bg:'medbay',text:[
  'Past the Warden’s chamber lies a hollow lined with husks, old and still. “Captain, whatever lived here is long gone,” Brannigan says. “Long gone, or long since became something else,” he adds, quieter.',
  '“We have a minute, not more,” Ironside says.'],
  choices:[
   {text:'Patch yourself up properly',check:{stat:'resolve',dc:9},win:{msg:'Your hands stay steady. The wounds close.',goto:'ch3_descent',fx:{hp:10}},lose:{msg:'Pain blurs your vision, but you seal the worst of it.',goto:'ch3_descent',fx:{hp:3}}},
   {text:'Search the husks for anything useful',check:{stat:'guile',dc:12},win:{msg:'Something intact, still faintly warm.',goto:'ch3_descent',fx:{give:'small'}},lose:{msg:'One of the husks is not as dead as it looked.',goto:'ch3_descent',fx:{hp:-3}}},
   {text:'Press on, no time to waste',goto:'ch3_descent'}]},
 ch3_descent:{title:'The Last Descent',text:[
  'Below the nest, a shaft drops straight down toward a light that should not exist this deep. “That is the core, Captain,” Brannigan says. “Whatever is down there, it is close now,” he adds.',
  '“Then let’s finish it,” Ironside says, checking his blade one last time.'],
  choices:[
   {text:'Take the narrow service shaft',check:{stat:'resolve',dc:12},win:{msg:'You keep your footing on the long drop down.',goto:'ch3_relic'},lose:{msg:'You slip and ride the last ten meters on your back.',goto:'ch3_relic',fx:{hp:-5}}},
   {text:'Blast through the sealed floor',check:{stat:'might',dc:15},win:{msg:'The floor gives way clean, and you drop through.',goto:'ch3_relic'},lose:{msg:'The charge goes wrong and the blast catches you too.',goto:'ch3_relic',fx:{hp:-7}}}]},
 ch3_relic:{title:'The Relic Chamber',bg:'armory',text:[
  'A chamber of grown bone-white pillars holds two things that do not belong to the hive at all: a gauntlet fused from something that still twitches, and a vial of light sealed in old human glass. “Captain, those were not made down here,” Brannigan says. “Salvage, maybe. Or bait,” he adds.',
  'Ironside can only carry one. “Choose fast,” Quill says. “It knows we are here now,” she adds.'],
  choices:[{text:'Take the Hivebreaker Gauntlet',goto:'ch3_threshold',fx:{give:'hiveblade'}},{text:'Take the Sovereign’s Elixir',goto:'ch3_threshold',fx:{give:'elixir'}}]},
 ch3_threshold:{title:'The Sovereign’s Threshold',bg:'gate',text:[
  'The last passage opens on a vast dark chamber, and something vast stirs within it, half-seen. “It knows your name, Captain,” Brannigan says, and for the first time he sounds afraid. “It has known it since Kraag,” he adds.',
  '“Then it has had long enough to get used to it,” Ironside says.'],
  choices:[
   {text:'Slip along the chamber wall unseen',check:{stat:'guile',dc:14},win:{msg:'You reach the center before it turns.  Your instincts sharpen.',goto:'ch3_boss',fx:{stat:{guile:1},flag:'stealth3'}},lose:{msg:'Something vast shifts toward the sound of your boots. Your confidence slips.',goto:'ch3_boss',fx:{stat:{guile:-1},flag:'stealth3'}}},

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
/* No story line repeats within the current fight until every line in its pool has been used; once the
   pool wraps around, the line is marked as a repeat so the caller can say "Again". Tracking lives on
   state.fight.used, keyed by pool name, and is reset whenever a new fight starts (see enter()). */
function pickFresh(poolKey,pool){
 const used=state.fight.used[poolKey]||(state.fight.used[poolKey]=[]);
 let avail=pool.map((_,i)=>i).filter(i=>!used.includes(i)),again=false;
 if(!avail.length){state.fight.used[poolKey]=[];avail=pool.map((_,i)=>i);again=true;}
 const idx=avail[Math.floor(Math.random()*avail.length)];
 state.fight.used[poolKey].push(idx);
 return{text:pool[idx],again};
}
/* Same no-repeat-until-exhausted rule as pickFresh(), but for lines that only ever fire once per fight
   (an enemy's death, the Captain's own death) — tracked on SAVES.textUsed instead of the current fight,
   so variety carries across every fight and every death this session, not just within one. */
function pickGlobal(poolKey,pool){
 if(!SAVES.textUsed)SAVES.textUsed={};
 const used=SAVES.textUsed[poolKey]||(SAVES.textUsed[poolKey]=[]);
 let avail=pool.map((_,i)=>i).filter(i=>!used.includes(i)),again=false;
 if(!avail.length){SAVES.textUsed[poolKey]=[];avail=pool.map((_,i)=>i);again=true;}
 const idx=avail[Math.floor(Math.random()*avail.length)];
 SAVES.textUsed[poolKey].push(idx);
 return{text:pool[idx],again};
}
const againify=t=>'Again, '+t.charAt(0).toLowerCase()+t.slice(1);

function freshState(n){const c=n>1?SAVES.carry:null,needsAlloc=n===1&&!SAVES.build,needsLoadout=n===1&&!needsAlloc&&!SAVES.loadout,
  baseBoost=c?{...c.boost}:(SAVES.build?{...SAVES.build}:{}),
  startInv=c?c.inv.slice():(SAVES.loadout?SAVES.loadout.inv.slice():['chainblade','carapace','stim']),
  startEq=c?{...c.eq}:(SAVES.loadout?{...SAVES.loadout.eq}:{melee:'chainblade',gun:null,body:'carapace',legs:null});
 return{scene:needsAlloc?'alloc':needsLoadout?'loadout':START[n],hp:CONFIG.maxHp,flags:{},inv:startInv,eq:startEq,fight:null,pending:null,rolls:[],acts:[],note:'',boost:baseBoost,chapter:n,
  allocDraft:needsAlloc?{might:0,guile:0,resolve:0}:undefined,loadoutDraft:needsLoadout?{weapon:null,armor:null}:undefined};}
function newGame(n){stopVoice();n=n||(state&&state.chapter)||1;state=freshState(n);enter(state.scene);}
const isUnlocked=n=>n===1||!!(SAVES.unlocked&&SAVES.unlocked[n]);
function goToChapter(n){
 if(!isUnlocked(n))return;
 SAVES[state.chapter]=state;stopVoice();
 if(SAVES[n]){state=SAVES[n];show();}else{state=freshState(n);enter(START[n]);}
 buildChapters();

function buildChapters(){const box=$('chapters'),all=()=>box.querySelectorAll('details');let lock=false;
 const layout=$('layout');if(layout&&box.contains(layout))document.body.appendChild(layout); // buildChapters() can run more than once (e.g. 'New game'); #layout may already be nested inside box from an earlier call, and box.innerHTML would destroy it if left there — move it out (still attached, so later $('layout') lookups keep finding it) before wiping box
 box.innerHTML=Object.keys(CHAPTERS).map(n=>{const u=isUnlocked(+n);
  return `<details class="chapter${u?'':' locked'}" id="ch${n}"><summary><span class="chev" aria-hidden="true">▾</span><div class="chaptext"><small>${SAGA}</small><b>Chapter ${n}: ${CHAPTERS[n]}</b>${u?'':'<small class="lockmsg">Locked — finish the previous chapter first</small>'}</div></summary><div class="chapbody"></div></details>`;
 }).join('');
 all().forEach(d=>{
  d.querySelector('summary').addEventListener('click',e=>{if(!isUnlocked(+d.id.slice(2)))e.preventDefault();});
  d.addEventListener('toggle',()=>{if(lock||!d.open)return;lock=true;
   all().forEach(o=>{if(o!==d)o.open=false;});d.querySelector('.chapbody').append($('layout'));
   const n=+d.id.slice(2);if(n!==state.chapter){SAVES[state.chapter]=state;stopVoice();if(SAVES[n]){state=SAVES[n];show();}else{state=freshState(n);enter(START[n]);}}
   setTimeout(()=>{lock=false;},0);});
 });
 $('ch'+state.chapter).open=true;}

/* ===== SAVING: localStorage only, game state only (see security review S1/S2). Every value coming back
   out of storage is untrusted: scenes, item ids and numbers are checked against the game's own data before
   use, and anything unrecognized is dropped rather than trusted. Nothing here is ever run as code. ===== */
const EQ_SLOTS=['melee','gun','body','legs'];
function sanitizeEq(raw,inv){const eq={};for(const slot of EQ_SLOTS){const id=raw&&raw[slot];eq[slot]=(id&&ITEMS[id]&&ITEMS[id].slot===slot&&inv.includes(id))?id:null;}return eq;}
function sanitizeBoost(raw){const boost={};if(raw&&typeof raw==='object')for(const k in raw)if(k in CONFIG.stats&&typeof raw[k]==='number'&&isFinite(raw[k]))boost[k]=Math.max(-20,Math.min(20,raw[k]));return boost;}
function sanitizeCarry(raw){
 if(!raw||typeof raw!=='object')return null;
 const inv=Array.isArray(raw.inv)?raw.inv.filter(id=>ITEMS[id]).slice(0,CONFIG.bag):[];
 return{inv,eq:sanitizeEq(raw.eq,inv),boost:sanitizeBoost(raw.boost)};
}
function sanitizeBuild(raw){
 if(!raw||typeof raw!=='object')return null;
 const out={};let sum=0;
 for(const k of['might','guile','resolve']){const v=raw[k];if(typeof v==='number'&&isFinite(v)&&v>=0&&v<=CONFIG.allocPoints){out[k]=Math.floor(v);sum+=out[k];}else out[k]=0;}
 if(sum>CONFIG.allocPoints)return null;
 return out;
}
const LOADOUT_WEAPONS=['melee','gun'],LOADOUT_ARMORS={might:'bodyMight',guile:'bodyGuile',resolve:'bodyResolve',mix:'bodyMix'};
function sanitizeLoadoutDraft(raw){
 const weapon=raw&&LOADOUT_WEAPONS.includes(raw.weapon)?raw.weapon:null;
 const armor=raw&&raw.armor in LOADOUT_ARMORS?raw.armor:null;
 return{weapon,armor};
}
function sanitizeLoadout(raw){
 if(!raw||typeof raw!=='object')return null;
 const inv=Array.isArray(raw.inv)?raw.inv.filter(id=>ITEMS[id]).slice(0,CONFIG.bag):[];
 if(!inv.length)return null;
 return{inv,eq:sanitizeEq(raw.eq,inv)};
}
function sanitizeUnlocked(raw){
 const out={1:1};
 if(raw&&typeof raw==='object')for(const k in raw){const n=+k;if(Number.isInteger(n)&&CHAPTERS[n])out[n]=1;}
 return out;
}
function sanitizeState(raw,n){
 if(!raw||typeof raw!=='object')return null;
 const scene=raw.scene;
 if(typeof scene!=='string'||!SCENES[scene])return null;
 let hp=raw.hp;if(typeof hp!=='number'||!isFinite(hp))return null;
 hp=Math.max(0,Math.min(CONFIG.maxHp,hp));
 const inv=Array.isArray(raw.inv)?raw.inv.filter(id=>ITEMS[id]).slice(0,CONFIG.bag):[];
 const eq=sanitizeEq(raw.eq,inv);
 const flags={};if(raw.flags&&typeof raw.flags==='object')for(const k in raw.flags)if(typeof k==='string')flags[k]=1;
 const boost=sanitizeBoost(raw.boost);
 const pending=(raw.pending&&ITEMS[raw.pending])?raw.pending:null;
 const rolls=Array.isArray(raw.rolls)?raw.rolls.filter(x=>typeof x==='string').slice(-200):[];
 const acts=Array.isArray(raw.acts)?raw.acts.filter(x=>typeof x==='string').slice(-200):[];
 const note=typeof raw.note==='string'?raw.note:'';
 const def=SCENES[scene].fight,savedFightHp=raw.fight&&typeof raw.fight.hp==='number'?raw.fight.hp:def&&def.hp;
 const fight=def?{...def,max:def.hp,hp:Math.max(0,Math.min(def.hp,savedFightHp)),used:{}}:null;
 const allocDraft=scene==='alloc'?(sanitizeBuild(raw.allocDraft)||{might:0,guile:0,resolve:0}):undefined;
 const loadoutDraft=scene==='loadout'?sanitizeLoadoutDraft(raw.loadoutDraft):undefined;
 return{scene,hp,flags,inv,eq,fight,pending,rolls,acts,note,boost,chapter:n,lp:0,allocDraft,loadoutDraft};
}
function persist(){try{SAVES[state.chapter]=state;localStorage.setItem(SAVE_KEY,JSON.stringify({v:SAVE_VER,chapter:state.chapter,saves:SAVES}));}catch(e){}}
function loadSave(){
 try{
  const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
  const data=JSON.parse(raw);
  if(!data||data.v!==SAVE_VER||!data.saves||typeof data.saves!=='object')return false;
  let found=false;
  for(const k in data.saves){
   if(k==='carry'){const c=sanitizeCarry(data.saves.carry);if(c)SAVES.carry=c;continue;}
   if(k==='build'){const b=sanitizeBuild(data.saves.build);if(b)SAVES.build=b;continue;}
   if(k==='loadout'){const l=sanitizeLoadout(data.saves.loadout);if(l)SAVES.loadout=l;continue;}
   if(k==='unlocked'){SAVES.unlocked=sanitizeUnlocked(data.saves.unlocked);continue;}
   const n=+k;if(!Number.isInteger(n)||!CHAPTERS[n])continue;
   const s=sanitizeState(data.saves[k],n);if(s){SAVES[n]=s;found=true;}
  }
  if(!found)return false;
  const want=+data.chapter,startChapter=SAVES[want]?want:Object.keys(SAVES).map(Number).find(x=>!isNaN(x)&&CHAPTERS[x]&&SAVES[x]);
  if(!SAVES[startChapter])return false;
  state=SAVES[startChapter];return true;
 }catch(e){return false;}
}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

function enter(id){state.scene=id;const f=SCENES[id].fight;state.fight=f?{...f,max:f.hp,used:{}}:null;state.lp=0;

  if(!SAVES.unlocked)SAVES.unlocked={1:1};SAVES.unlocked[state.chapter+1]=1;buildChapters();}
 show();
 if(/victory/.test(id))sfx('victory');else if(id==='dead')sfx('death');narrate(id);}

function odds(c){const m=mod(c);let k=0;for(let r=1;r<=CONFIG.die;r++)if(r===CONFIG.die||(r>1&&r+m>=c.dc))k++;return Math.round(k*100/CONFIG.die);}
function rollCheck(c){const roll=1+Math.floor(Math.random()*CONFIG.die),m=mod(c),total=roll+m;
 const o=roll===CONFIG.die?'crit':roll===1?'fumble':total>=c.dc?'success':'fail';
 return{roll,m,total,o,pass:o==='crit'||o==='success'};}
const apply=fx=>{for(const k in(fx||{}))EFFECTS[k]&&EFFECTS[k](state,fx[k]);};
const evasion=()=>mod({stat:'guile'});
const hurt=n=>{const d=Math.max(1,n-armorDr(state)-evasion());EFFECTS.hp(state,-d);return d;};
function foeHit(f,add){const dr=armorDr(state),ev=evasion(),d=hurt(f.dmg+add);
 return `Enemy attack ${f.dmg}${add?` + ${add} reckless`:''} − ${dr} Defense − ${ev} Evasion = ${d} damage${f.dmg+add-dr-ev<1?' (minimum 1)':''}`;}

function breakdown(r,c){const a=c.stat==='might'?gear(state).melee.acc:(c.bonus||0),g=gearStatBonus(state,c.stat),b=(state.boost&&state.boost[c.stat])||0,base=CONFIG.stats[c.stat],o=r.m-base-a-g-b,sg=n=>n<0?'\u2212':'+';
 return `${r.roll} + ${LABELS[c.stat]} ${base}`+(a?` ${sg(a)} Accuracy ${Math.abs(a)}`:'')+(g?` ${sg(g)} Armor ${Math.abs(g)}`:'')+(b?` ${sg(b)} Training ${Math.abs(b)}`:'')+(o?` ${sg(o)} Bonus ${Math.abs(o)}`:'')+` = ${r.total}`;}

function renderText(){const sc=SCENES[state.scene],text=typeof sc.text==='function'?sc.text(state):sc.text;$('text').innerHTML=`<h2>${sc.title}</h2>`+(state.note?`<p class="note">${state.note}</p>`:'')+text.map(p=>`<p>${p}</p>`).join('');}
function renderHist(){$('acts').innerHTML=state.acts.slice().reverse().map(t=>`<li>${t}</li>`).join('')||'<li>No actions yet.</li>';$('hist').innerHTML=state.rolls.slice().reverse().map(t=>`<li>${t}</li>`).join('')||'<li>No rolls yet.</li>';}
function show(){
 persist();renderHud();renderArt();const sc=SCENES[state.scene],box=$('choices');box.innerHTML='';
 renderText();
 if(state.scene==='alloc'){renderAlloc(box);return;}
 if(state.scene==='loadout'){renderLoadout(box);return;}
 if(state.pending){const id=state.pending,i=ITEMS[id];
  box.innerHTML=`<h3 class="tip" tabindex="0" data-tip="${tipText(id)}">Loot: ${nm(id)}</h3><p>${info(i)}. Your pack holds ${state.inv.length} of ${CONFIG.bag}.</p>`;
  const done=()=>{state.pending=null;show();};
  if(state.inv.length<CONFIG.bag)btn('Take it',()=>{state.inv.push(id);logAct('Picked up '+nm(id));done();});
  else state.inv.forEach(x=>btn(`Swap for ${nm(x)}`,()=>{logAct('Dropped '+nm(x)+' and picked up '+nm(id));dropItem(x);state.inv.push(id);done();}));
  btn('Leave it',()=>{logAct('Left '+nm(id));done();});return;}
 if(sc.end){
  const next=state.chapter+1;
  if(state.scene!=='dead'&&CHAPTERS[next])btn(`Continue to Chapter ${next}: ${CHAPTERS[next]}`,()=>{$('roll').classList.remove('show');goToChapter(next);});
  btn('Fight again',()=>{$('roll').classList.remove('show');newGame();});
  return;}
 if(state.fight){const f=state.fight,g=gear(state);
  const actions=[['strike','Strike',{stat:'might',dc:f.dc,vs:`Evasion ${f.dc}`},`Hit for ${g.melee.atk}, minus ${f.def} Defense`],
   ['wild','Reckless blow',{stat:'might',dc:f.dc+3,vs:`Evasion ${f.dc} +3 reckless = ${f.dc+3}`},`Hit for ${g.melee.atk*2}, minus ${f.def} Defense, but costs more if you miss`]];
  if(g.gun)actions.push(['aim','Aimed shot',{stat:'guile',dc:f.dc+2,bonus:g.gun.acc,vs:`Evasion ${f.dc} +2 aimed = ${f.dc+2}`},`Hit for ${g.gun.atk} with the ${g.gun.n}, ignoring Defense`]);
  actions.push(['guard','Guard and endure',{stat:'resolve',dc:f.acc,vs:`Enemy accuracy ${f.acc}`},'Block the blow and recover 2']);
  actions.forEach(([k,t,c,d])=>btn(`${t}<small>${LABELS[c.stat]}${CONFIG.showOdds?', '+odds(c)+'% to succeed':''}. ${d}</small>`,()=>act(k,c)));
  if(!g.gun){const p=document.createElement('p');p.className='note';p.textContent='No ranged weapon equipped — find and equip a gun to use Aimed shot.';box.append(p);}
  return;}
 sc.choices.forEach(ch=>btn(ch.text+(ch.check?`<small>${LABELS[ch.check.stat]} check${CONFIG.showOdds?', '+odds(ch.check)+'% to succeed':''}</small>`:''),()=>choose(ch)));
}
const lock=v=>{busy=v;document.querySelectorAll('#choices button').forEach(b=>b.disabled=v);};

async function choose(ch){
 if(busy)return;lock(true);stopVoice();await toStory();let br=ch,rr=null;const before=snap();
 if(ch.check){rr=await rollUI(ch.check);br=rr.pass?ch.win:ch.lose;}
 apply(br.fx);if(rr){showResult(rr,br.msg,before);sfx(rr.pass?(ch.sfx||{might:'smash',guile:'click',resolve:'chime'}[ch.check.stat]):'hit');}
 logAct(actLine((ch.past||`Chose to ${ch.text.charAt(0).toLowerCase()+ch.text.slice(1)}`)+(rr?(rr.pass?' and succeeded':' and failed'):''),before));
 if(state.hp<=0){const p=pickGlobal('playerFall',TEXT.playerFall);state.note=p.again?againify(p.text):p.text;state.scene='dead';}else state.scene=br.goto||state.scene;
 await sleep(ch.check?1100:0);lock(false);enter(state.scene);
}

async function act(kind,c){
 if(busy)return;lock(true);stopVoice();await toStory();const before=snap(),f=state.fight,fh=f.hp,rg=kind==='aim',w=rg?gear(state).gun:gear(state).melee,r=await rollUI(c);let m,calc;
 const F=(key,pool)=>{const p=pickFresh(key,pool),filled=fill(p.text,f,w);return p.again?againify(filled):filled;};
 if(kind==='guard'){if(r.pass){apply({hp:2});m=F('guardOk',TEXT.guardOk);calc='No damage taken. You recover 2 Vitality.';}else{calc=foeHit(f,0);m=F('guardBad',TEXT.guardBad);}}
 else if(r.pass){const cr=r.o==='crit'?w.atk:0,ml=kind==='wild'?2:1,df=(cr||kind==='aim')?0:f.def,d=Math.max(1,w.atk*ml+cr-df);f.hp=Math.max(0,f.hp-d);calc=`Damage: ${w.atk}${ml>1?' \u00d7 2 reckless':''}${cr?` + ${cr} critical`:''} \u2212 ${df} Defense${cr?' (critical ignores Defense)':kind==='aim'?' (aimed shot ignores Defense)':''} = ${d}`;
  const hitKey=kind==='wild'?'wild.melee':rg?'hit.ranged':'hit.melee',hitPool=kind==='wild'?TEXT.wild.melee:rg?TEXT.hit.ranged:TEXT.hit.melee;
  m=`${state.lp?pick(AGAIN):'You hit for'} ${d}. `+F(hitKey,hitPool);state.lp=1;}
 else{calc=foeHit(f,kind==='wild'?2:0);
  const missKey=kind==='wild'?'wildMiss':rg?'miss.ranged':'miss.melee',missPool=kind==='wild'?TEXT.wildMiss:rg?TEXT.miss.ranged:TEXT.miss.melee;
  m=F(missKey,missPool);state.lp=0;}
 if(state.hp<=0){const p=pickGlobal('playerFall',TEXT.playerFall);state.note=p.again?againify(p.text):p.text;state.scene='dead';state.fight=null;}
 else if(f.hp<=0){const p=pickGlobal('fall',TEXT.fall),fallText=fill(p.text,f,w);m+=' '+(p.again?againify(fallText):fallText);state.fight=null;if(f.drop)apply({give:f.drop});state.scene=SCENES[state.scene].then;}
 else if(Math.random()<.6)m+=' '+fill(pickFresh('say',f.say).text,f,w);
 showResult(r,m,before,calc);actSfx(kind,r);flashFoe(kind,r);
 {const L={strike:['Struck','Missed'],wild:['Landed a reckless blow on','Missed a reckless blow on'],aim:['Landed an aimed shot on','Missed an aimed shot on'],guard:['Held a guard against','Lost a guard against']}[kind],dealt=fh-f.hp;
 logAct(actLine(`${L[r.pass?0:1]} ${f.name}${dealt?` for ${dealt}`:''}${f.hp<=0?', and it fell':''}`,before));}await sleep(900);lock(false);
 if(state.fight){show();}else enter(state.scene);
}
/* ===== AUDIO: voice-over and sound effects. Flags: CONFIG.voice, CONFIG.sfx (also the buttons in the status panel) ===== */
/* VOICE: one narrator reads everything (story and results). Every spoken line carries the speaker's name in the text. Tweak pitch (lower = deeper) and rate (lower = slower). */
const NARRATOR={pitch:.8,rate:.88};
let narV=null;
const BAD=/junior|kid|child|boy|girl|novelty|whisper|bubbles|bad news|bells|boing|cellos|deranged|good news|hysterical|organ|trinoids|zarvox|albert|ralph|superstar|jester|wobble|fred/i;
function voiceFor(){if(narV)return narV;
 const all=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!BAD.test(v.name));if(!all.length)return null;
 const fem=/female|samantha|zira|susan|karen|moira|victoria|fiona|hazel|serena|tessa|catherine|libby|sonia|jenny|aria|ava|allison/i,
  us=v=>/en[-_]US/i.test(v.lang)?0:1,q=v=>/natural|neural|online|premium|enhanced|siri|google/i.test(v.name)?0:1,
  deep=v=>/guy|davis|christopher|eric|roger|aaron|alex|evan|tom|david|mark|steffan|brian|andrew|jason|male/i.test(v.name)?0:1,
  pool=all.filter(v=>!fem.test(v.name)).sort((a,b)=>us(a)-us(b)||q(a)-q(b)||deep(a)-deep(b));
 return narV=(pool[0]||all[0]);}
let VQ=[],vplay=false,vtok=0;
function vpush(it){VQ.push(it);if(!vplay)vnext();}
function vnext(){const it=VQ.shift();if(!it){vplay=false;return;}vplay=true;const tok=vtok;let fired=false;
 const done=()=>{if(fired||tok!==vtok)return;fired=true;vnext();};
 it.u.onend=done;it.u.onerror=done;setTimeout(done,it.text.length*150+2500);speechSynthesis.speak(it.u);}
function say(text){if(!CONFIG.voice||!('speechSynthesis' in window))return;
 (text.replace(/<[^>]+>/g,'').match(/[^.!?]+[.!?]*/g)||[]).filter(c=>/\w/.test(c)).forEach(c=>{
  const ex=/!\s*$/.test(c),qu=/\?\s*$/.test(c),el=/\.\.\.|\u2026/.test(c),u=new SpeechSynthesisUtterance(c.trim());
  u.pitch=NARRATOR.pitch*(ex||qu?1.03:1);u.rate=NARRATOR.rate*(ex?1.02:el?.9:1);u.volume=ex?1:.92;
  const vo=voiceFor();if(vo)u.voice=vo;vpush({u,text:c});});}
const stopVoice=()=>{vtok++;VQ=[];vplay=false;if('speechSynthesis' in window)speechSynthesis.cancel();};
const speakLine=t=>say(t||'');
const narrate=id=>{const sc=SCENES[id],text=typeof sc.text==='function'?sc.text(state):sc.text;text.forEach(p=>speakLine(p));};
/* SFX: synthesized with Web Audio, no files. Add an entry, then call sfx('name') anywhere, or set sfx:'name' on a scene choice. */
let AC=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='sine',vol=.2,t0=0,f2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d);}
function noise(d,f0,f1,vol=.3,t0=0,type='lowpass'){const a=ac();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;
 const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+t0;s.buffer=b;fl.type=type;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t);}
const SFX={
 slash:()=>{noise(.18,6000,800,.35,0,'highpass');tone(180,.12,'sawtooth',.1,.02,60);},
 shoot:()=>{tone(1200,.28,'sawtooth',.18,0,120);noise(.15,4000,600,.15,0,'bandpass');},
 explosion:()=>{noise(1.1,1800,40,.7);tone(90,.9,'sine',.5,0,30);},
 smash:()=>{noise(.4,1200,80,.5);tone(120,.3,'square',.2,0,40);},
 hit:()=>{tone(140,.2,'sine',.4,0,50);noise(.12,900,200,.3);},
 clang:()=>{tone(880,.25,'triangle',.2);tone(1320,.2,'triangle',.12,.01);},
 pickup:()=>{tone(520,.1,'square',.1);tone(780,.14,'square',.1,.09);},
 equip:()=>{tone(300,.06,'square',.12);tone(600,.08,'triangle',.12,.07);noise(.05,5000,3000,.15,.07,'highpass');},
 drop:()=>{tone(110,.15,'sine',.3,0,60);},
 heal:()=>{[440,554,659].forEach((f,i)=>tone(f,.25,'sine',.12,i*.09));},
 click:()=>{noise(.03,4000,2000,.2,0,'highpass');noise(.03,4000,2000,.2,.08,'highpass');},
 chime:()=>{tone(660,.4,'sine',.15);tone(990,.5,'sine',.1,.05);},
 roll:()=>{for(let i=0;i<7;i++)noise(.025,3000,1500,.15,i*.11,'highpass');},
 crit:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.18,'triangle',.15,i*.07));},
 fumble:()=>{tone(150,.4,'sawtooth',.2,0,60);},
 death:()=>{tone(220,1.4,'sawtooth',.25,0,40);noise(1,800,60,.3);},
 victory:()=>{SFX.explosion();[392,523,659,784].forEach((f,i)=>tone(f,.4,'triangle',.15,.9+i*.18));}
};
const sfx=n=>{if(CONFIG.sfx&&SFX[n])try{SFX[n]();}catch(e){}};


function actSfx(kind,r){const ranged=kind==='aim';
 sfx(kind==='guard'?(r.pass?'clang':'hit'):r.pass?(kind==='wild'?(ranged?'explosion':'smash'):ranged?'shoot':'slash'):'hit');}
function renderOpts(){$('vtog').textContent='Voice: '+(CONFIG.voice?'On':'Off');$('stog').textContent='Effects: '+(CONFIG.sfx?'On':'Off');}
$('vtog').onclick=()=>{CONFIG.voice=!CONFIG.voice;renderOpts();if(CONFIG.voice)narrate(state.scene);else stopVoice();};
$('stog').onclick=()=>{CONFIG.sfx=!CONFIG.sfx;renderOpts();sfx('equip');};
$('vrep').onclick=()=>{stopVoice();narrate(state.scene);};
$('nsave').onclick=()=>{if(!confirm('Erase your saved progress in every chapter and start over?'))return;clearSave();for(const k in SAVES)delete SAVES[k];newGame(1);buildChapters();};
renderOpts();
/* ===== TOOLTIPS: any element with data-tip. Hover on monitors, tap to open and tap again to close on touch ===== */
const tipEl=document.createElement('div');tipEl.id='tip';document.body.append(tipEl);
let tipOn=null;const canHover=()=>matchMedia('(hover:hover)').matches;
function showTip(el){tipOn=el;tipEl.innerHTML=el.dataset.tip;tipEl.style.display='block';
 const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
 tipEl.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left))+'px';
 tipEl.style.top=(r.bottom+h+12>innerHeight?Math.max(8,r.top-h-8):r.bottom+8)+'px';}
function hideTip(){tipOn=null;tipEl.style.display='none';}
document.addEventListener('click',e=>{if(canHover())return;const el=e.target.closest('[data-tip]');if(!el||el===tipOn)hideTip();else showTip(el);});
document.addEventListener('mouseover',e=>{const el=canHover()&&e.target.closest('[data-tip]');if(el&&el!==tipOn)showTip(el);});
document.addEventListener('mouseout',e=>{if(canHover()&&e.target.closest('[data-tip]'))hideTip();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip();});
addEventListener('scroll',hideTip,{passive:true});
/* ===== DEVICE DETECTION: touch or narrow screen = mobile, otherwise desktop ===== */
const mqNarrow=matchMedia('(max-width:820px)'),mqTouch=matchMedia('(hover:none) and (pointer:coarse)');
function detectDevice(){const d=mqTouch.matches||mqNarrow.matches?'mobile':'desktop',h=document.documentElement;
 if(h.dataset.device!==d){h.dataset.device=d;$('packbox').open=$('histbox').open=$('actbox').open=d==='desktop';}}
detectDevice();mqNarrow.addEventListener('change',detectDevice);mqTouch.addEventListener('change',detectDevice);
drawBg();addEventListener('resize',drawBg);mqDark.addEventListener('change',drawBg);drawPortrait();
if(loadSave())show();else newGame();
buildChapters();
</script>
